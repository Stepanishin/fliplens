# DigitalOcean App Platform spec. Create the app from this file:
#   doctl apps create --spec .do/app.yaml      (or paste it in Create App > "Edit app spec")
# Secret values are NOT stored here: set them in the dashboard (Settings > App-Level Environment Variables, Encrypt).
name: fliplens
region: fra
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/fliplens
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - { key: APP_URL, scope: RUN_TIME, value: "${APP_URL}" }
      - { key: EBAY_ENV, scope: RUN_TIME, value: production }
      - { key: OPENAI_VISION_MODEL, scope: RUN_TIME, value: gpt-6-sol }
      - { key: OPENAI_VISION_FAST_MODEL, scope: RUN_TIME, value: gpt-6-luna }
      - { key: OPENAI_VISION_ESCALATE_BELOW, scope: RUN_TIME, value: "0.8" }
      - { key: ENABLE_BENCHMARK, scope: RUN_TIME, value: "0" }
      # Secrets: values set in the dashboard.
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET }
      - { key: EBAY_CLIENT_ID, scope: RUN_TIME, type: SECRET }
      - { key: EBAY_CLIENT_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: OPENAI_API_KEY, scope: RUN_TIME, type: SECRET }
      - { key: GOOGLE_CLIENT_ID, scope: RUN_TIME, type: SECRET }
      - { key: ADMIN_EMAILS, scope: RUN_TIME, type: SECRET }
      # Launch with Stripe test mode first; switch to STRIPE_SECRET_KEY (+ STRIPE_ALLOW_LIVE=1) when going live.
      - { key: STRIPE_SECRET_KEY_TEST, scope: RUN_TIME, type: SECRET }
      - { key: STRIPE_WEBHOOK_SECRET_TEST, scope: RUN_TIME, type: SECRET }
