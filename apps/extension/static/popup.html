<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlipLens</title>
    <style>
      :root { --bg: #fff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --accent-2: #0f766e; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15181d; --fg: #f3f4f6; --muted: #9ca3af; --line: #2a2f37; --accent-2: #14b8a6; } }
      body { margin: 0; width: 280px; padding: 14px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      header img { width: 24px; height: 24px; }
      header b { font-size: 15px; }
      p { margin: 0 0 10px; }
      .muted { color: var(--muted); font-size: 12px; }
      .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 6px 0 12px; }
      .bar span { display: block; height: 100%; background: var(--accent-2); }
      a.btn { display: block; text-align: center; font-weight: 600; text-decoration: none; border-radius: 9px; padding: 9px 12px; background: var(--accent-2); color: #fff; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon-48.png" alt="" /><b>FlipLens</b></header>
    <main id="main"><p class="muted">…</p></main>
    <script src="popup.js"></script>
  </body>
</html>
